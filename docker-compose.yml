services:
  postgres:
    image: postgres:16
    container_name: seungyo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seungyo}
      POSTGRES_USER: ${POSTGRES_USER:-seungyo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seungyo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seungyo} -d ${POSTGRES_DB:-seungyo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: seungyo-redis
    restart: unless-stopped

  api-server:
    build:
      context: ./api-server
    container_name: seungyo-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  data-worker:
    build:
      context: ./data-worker
    container_name: seungyo-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-server:
        condition: service_healthy
    command: python -m worker.main

volumes:
  postgres_data:
